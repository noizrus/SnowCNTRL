name: SnowCNTRL
options:
  bundleIdPrefix: com.snowcntrl
  deploymentTarget:
    iOS: "16.1"
configs:
  Debug: debug
  Release: release
settings:
  base:
    DEVELOPMENT_TEAM: 6FNP2ZXFHD
    CODE_SIGN_STYLE: Automatic
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads.git
    from: "11.0.0"
targets:
  SnowCNTRL:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - target: SnowCNTRLWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowcntrl.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSUserTrackingUsageDescription: >-
          Cette identification permet d'afficher des publicités pertinentes.
          Vous pouvez refuser sans que cela affecte les fonctionnalités de l'app.
        NSLocationWhenInUseUsageDescription: >-
          Utilisée uniquement pour centrer la carte sur ta position et
          faciliter la sélection de ta rue. Facultatif — tu peux aussi
          chercher une adresse ou déposer un repère manuellement.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.snowcntrl.app.refresh
        NSSupportsLiveActivities: true
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2u9pt9hc89.skadnetwork
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: SnowCNTRL.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.snowcntrl.app

  SnowCNTRLWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/Sources
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.snowcntrl.app.widget
        PRODUCT_NAME: SnowCNTRLWidget
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "YES"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: SnowCNTRL
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/SnowCNTRLWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.snowcntrl.app
